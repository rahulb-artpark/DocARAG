name: docarag

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DOCARAG_POSTGRES_DB:-docarag}
      POSTGRES_USER: ${DOCARAG_POSTGRES_USER:-docarag}
      POSTGRES_PASSWORD: ${DOCARAG_POSTGRES_PASSWORD:-docarag-local}
    ports:
      - "127.0.0.1:${DOCARAG_POSTGRES_PORT:-5432}:5432"
    volumes:
      - docarag-postgres:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  qdrant:
    image: qdrant/qdrant:v1.18.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DOCARAG_QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${DOCARAG_QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - docarag-qdrant:/qdrant/storage
    security_opt:
      - no-new-privileges:true

volumes:
  docarag-postgres:
  docarag-qdrant:
