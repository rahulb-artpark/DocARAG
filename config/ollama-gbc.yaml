# config/ollama-gbc.yaml
# Single-GPU (cuda:0) + Ollama setup of the full GBC (BookRAG) pipeline.
# - LLM + VLM + text-embedding  -> served by local Ollama (http://localhost:11434)
# - Rerankers + multimodal model -> loaded locally in-process via transformers on cuda:0
# - MinerU PDF parsing           -> "hybrid-engine" backend, loads locally in-process
#
# pdf_path / save_path are overridden per-document by the dataset config, so leave as-is.

pdf_path: TODO
save_path: TODO

llm:
  model_name: qwen3.6:35b            # installed Ollama model; serves text generation
  api_key: ollama
  api_base: http://localhost:11434
  backend: ollama
  max_tokens: 5000
  temperature: 0.1
  frequency_penalty: 0.0
  presence_penalty: 0.0
  max_workers: 4
  # Stock models declare a 256k context. Ollama sizes the KV cache from it and
  # spills to CPU, so cap it here rather than in a hand-built Modelfile.
  num_ctx: 16384
  # null lets index construction force thinking off (indexing_llm_config) while
  # leaving the query path on the model's own default. Set true/false to pin both.
  think: null

vlm:
  model_name: qwen3.6:35b            # vision-capable; figure descriptions + topology
  api_key: ollama
  api_base: http://localhost:11434
  temperature: 0.1
  max_tokens: 6000
  backend: ollama
  num_ctx: 16384

mineru:
  # hybrid-engine reads handwriting; pipeline does not. Measured on a cursive
  # scan (10P_CH11.pdf): pipeline scored a 44.9% dictionary-word rate where
  # printed documents score 93-98%, and found 3 titles. hybrid-engine scored
  # 96.7% and found 14, including the section heading whose absence had made
  # one defect's symptoms children of a different defect.
  #
  # It costs roughly 6x the parse time (29s vs 5s for 5 pages), which is the
  # trade this pipeline takes deliberately: a cheap parse that misreads the
  # page poisons every stage downstream of it.
  backend: hybrid-engine
  method: vlm                    # forced by the backend; kept explicit for readability
  # "high" is not just image/chart analysis: on this scan it is the difference
  # between 3 detected headings and 14. At medium the layout pass returns the
  # same 3 titles the pipeline backend finds, and a document with 3 headings
  # has no hierarchy to build -- one of them ends up parenting most of it.
  effort: high
  server_url: http://localhost:30000   # unused with a local *-engine backend
  lang: en

figures:
  # MinerU emits an image region as a crop with no interior text, so rendered
  # tables and charts arrive with no evidence at all. These re-read the crop.
  ocr: True                      # MinerU's own det/rec models, run over the crop
  describe: True                 # vlm says what the figure shows, grounded on the OCR text
  diagrams: True                 # vlm reads the node/edge topology a description flattens
  ocr_lang: en
  min_confidence: 0.5

tree:
  node_keywords: True
  node_summary: True

graph:
  extractor_type: "llm"
  local_model_name: "en_core_web_sm"
  image_description_force: True
  max_gleaning: 0
  refine_type: "advanced"
  embedding_config:
    model_name: qwen3-embedding:0.6b   # Ollama embedding model
    backend: ollama
    max_length: 4096
    api_base: "http://localhost:11434"
    # Without this a 0.6B model reserves 6.3GB of KV cache for a 32k context
    # it never uses, and the query stack no longer fits beside the LLM.
    num_ctx: 4096
  reranker_config:
    model_name: Qwen/Qwen3-Reranker-0.6B # loaded locally via transformers
    max_length: 4096
    device: "cuda:0"
    backend: local
    api_base: ""

vdb:
  mm_embedding: True
  manifest_dir_name: "qdrant-tree-attestation"
  qdrant_url: "http://127.0.0.1:6333"
  api_key_env: "QDRANT_API_KEY"
  timeout_seconds: 10.0
  # Named for the embedder and its width: a collection built at one dimension
  # cannot accept vectors of another, and _validate_existing_collection raises
  # rather than mixing them. A distinct name means the 1536d gme collection
  # stays queryable while this one is rebuilt.
  collection_name: "TreeVDB-qwen3vl-2048"
  embedding_config:
    # gme-Qwen2-VL hard-asserts transformers<4.52.0 in its own remote code,
    # and MinerU 3.4.4 requires >=4.57.3. They cannot share an interpreter, so
    # the multimodal embedder moves with the parser.
    model_name: Qwen/Qwen3-VL-Embedding-2B
    device: "cuda:0"
    torch_dtype: float16

rag_force_reprocess: True

rag:
  strategy: gbc
  variant: standard
  topk: 10
  sim_threshold: 0.3
  select_depth: 2
  max_retry: 2
  reranker_config:
    model_name: Qwen/Qwen3-Reranker-0.6B
    max_length: 4096
    device: "cuda:0"
    backend: local
    api_base: ""
  mm_reranker_config:
    model_name: Alibaba-NLP/gme-Qwen2-VL-2B-Instruct
    device: "cuda:0"
    # The checkpoint ships float32 and costs 8.3GB; bfloat16 halves it.
    torch_dtype: bfloat16
