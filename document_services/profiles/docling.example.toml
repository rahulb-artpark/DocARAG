schema_version = "docarag.parser-worker-profile.v1"
profile_id = "docling-local-example"
vendor = "docling"
parser_version = "docling-runtime-unattested-v1"
model_version = "docling-model-identity-unavailable-v1"
qualification = "uncertified"

[server]
host = "127.0.0.1"
port = 8101
max_request_bytes = 16777216
max_response_bytes = 67108864
max_in_flight = 1
request_read_timeout_seconds = 30.0
allow_non_loopback_bind = false
# bearer_token_env = "DOCARAG_DOCLING_WORKER_TOKEN"

[source]
allowed_roots = ["/srv/docarag/source-snapshots"]
max_source_bytes = 33554432
chunk_size = 1048576

[artifacts]
root = "/srv/docarag/parser-artifacts/docling"
max_artifact_bytes = 268435456
max_total_bytes_per_request = 536870912
max_artifacts_per_request = 4096
chunk_size = 1048576

[service]
base_url = "http://127.0.0.1:5001"
connect_timeout_seconds = 5.0
request_timeout_seconds = 30.0
operation_timeout_seconds = 1800.0
poll_interval_seconds = 1.0
max_poll_attempts = 3600
max_source_bytes = 33554432
max_request_bytes = 50331648
max_response_bytes = 268435456
max_pages_per_request = 64
expected_document_schema_version = "1.10.0"
allow_insecure_http = false
ocr_preset = "auto"
table_mode = "accurate"
pipeline = "standard"
enable_picture_classification = true
enable_chart_extraction = true
enable_code_enrichment = true
# api_key_env = "DOCARAG_DOCLING_SERVICE_API_KEY"

