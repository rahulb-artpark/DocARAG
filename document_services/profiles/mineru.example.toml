schema_version = "docarag.parser-worker-profile.v1"
profile_id = "mineru-local-example"
vendor = "mineru"
parser_version = "mineru-protocol-2-unattested"
model_version = "mineru-pipeline-unattested-v1"
qualification = "uncertified"

[server]
host = "127.0.0.1"
port = 8102
max_request_bytes = 16777216
max_response_bytes = 67108864
max_in_flight = 1
request_read_timeout_seconds = 30.0
allow_non_loopback_bind = false
# bearer_token_env = "DOCARAG_MINERU_WORKER_TOKEN"

[source]
allowed_roots = ["/srv/docarag/source-snapshots"]
max_source_bytes = 536870912
chunk_size = 1048576

[artifacts]
root = "/srv/docarag/parser-artifacts/mineru"
max_artifact_bytes = 536870912
max_total_bytes_per_request = 1073741824
max_artifacts_per_request = 100000
chunk_size = 1048576

[service]
base_url = "http://127.0.0.1:8000"
backend = "pipeline"
effort = "medium"
expected_protocol_version = 2
allow_insecure_http = false
connect_timeout_seconds = 10.0
control_timeout_seconds = 60.0
upload_timeout_seconds = 300.0
task_timeout_seconds = 3600.0
result_timeout_seconds = 600.0
poll_interval_seconds = 1.0
max_poll_attempts = 7200
max_source_bytes = 536870912
max_result_archive_bytes = 536870912
max_uncompressed_bytes = 1073741824
max_content_list_bytes = 268435456
max_middle_json_bytes = 134217728
max_middle_json_depth = 128
max_middle_json_nodes = 2000000
max_archive_members = 100000
max_pages_per_task = 256
max_tasks_per_request = 256
# bearer_token_env = "DOCARAG_MINERU_SERVICE_TOKEN"
